#      da GitHub Actions a ogni push che modifica questo file.
#
#  Regole veloci:
#    • I testi bilingue si scrivono così:   { it: "...", en: "..." }
#      oppure su più righe:
#          it: Testo italiano
#          en: English text
#      Se un testo è uguale nelle due lingue, scrivilo e basta.
#    • Nella forma { it: ..., en: ... } un testo che contiene una virgola
#      o i due punti va tra virgolette: { it: "Cagliari, Italia", en: ... }
#    • L'ordine nel file è l'ordine sul sito: metti in alto le voci recenti.
#    • "end: present" mostra "Presente"/"Present".
#    • Le righe che iniziano con # sono commenti e vengono ignorate.
# =====================================================================

