publications:
  - title: A robust approach to detect intersections between triangles with different numerical representations
    authors: [Luca Garau, Gianmarco Cherchi]
    year: 2025
    venue: International Conference in Central Europe on Computer Graphics, Visualization and Computer Vision (WSCG)
    type: inproceedings   # usato per BibTeX: article | inproceedings
    doi: 10.24132/CSRN.2025-7
    note:
      it: >-
        Full paper presentato a WSCG 2025. Introduce un approccio robusto per rilevare e classificare
        le intersezioni tra triangoli, con una libreria C++ header-only open-source.
      en: >-
        Full paper presented at WSCG 2025. Introduces a novel and robust approach for detecting and
        classifying triangle intersections, along with an open-source C++ header-only tool.

  - title: Triangle-triangle intersections with different numerical representations
    authors: [Luca Garau, Riccardo Scateni, Gianmarco Cherchi]
    year: 2025
    venue: IEEE Conference on Virtual Reality and 3D User Interfaces Abstracts and Workshops (VRW)
    type: inproceedings
    pages: 401–404
    publisher: IEEE
    doi: 10.1109/VRW66409.2025.00092
    note:
      it: >-
        Short paper presentato al workshop ReDigiTS di IEEE VR 2025: work-in-progress su uno strumento
        robusto per il rilevamento di intersezioni indipendente dalla rappresentazione numerica.
      en: >-
        Short paper presented at the ReDigiTS 2025 workshop at IEEE VR 2025: a work-in-progress on a
        robust intersection-detection tool independent of the numerical representation used.

