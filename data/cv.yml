education:

  - title: { it: Dottorato di Interesse Nazionale in Ai & Society, en: National PhD in AI & Society }
    org: { it: Università di Pisa | ISTI-CNR, en: University of Pisa | ISTI-CNR }
    logo: assets/img/logos/isti.jpeg
    start: 2026
    end: present
    supervisor: Dt. Daniela Giorgi, Prof. Gianmarco Cherchi, Dt. Luigi Malamo
    details:
      it: >-
        Dottorato nazionale in AI & Society presso l'ISTI-CNR e l'Università di Pisa, in collaborazione con l'Università di Cagliari.
        Il lavoro di ricerca si concentra nella Digital Fabrication e nel Geometry Processing, in particolare nella design computazionale di stampi rigidi e riusabili multi pezzo.
      en: >-
        National PhD in AI & Society at ISTI-CNR and the University of Pisa, in collaboration with the University of Cagliari.
        The research work focuses on Digital Fabrication and Geometry Processing, particularly in the computational design of multi-piece rigid molds.

  - title: { it: Laurea Magistrale in Informatica (Graphics and Vision), en: Master's Degree in Computer Science (Graphics and Vision) }
    org: { it: Università di Cagliari, en: University of Cagliari }
    logo: assets/img/logos/unica.png
    start: 2023
    end: 2025
    grade: 100/100 cum laude
    thesis: Classification and Robust Management of Triangle Intersections Using Alternative Numerical Representations
    supervisor: Dott. Gianmarco Cherchi
    details:
      it: >-
        Tesi incentrata su un nuovo approccio per rilevare e classificare le intersezioni tra
        triangoli indipendentemente dal sistema di rappresentazione numerica sottostante.
      en: >-
        Thesis focused on the development of a novel approach for detecting and classifying
        triangle intersections independently of the underlying numerical representation system.

