<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foto — Luca Garau</title>
  <meta name="description" content="Galleria fotografica di Luca Garau.">
  <link rel="canonical" href="https://lucagarau.github.io/pages/photos.html">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">
  <link href="/assets/css/polaroid.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" defer></script>
  <script src="/assets/js/core.js" defer></script>
  <script src="/assets/js/photo.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">Luca Garau</a>
      <nav class="nav" aria-label="Main">
        <a href="/#experience" data-i18n="nav.experience">Esperienza</a>
        <a href="/#education" data-i18n="nav.education">Formazione</a>
        <a href="/#publications" data-i18n="nav.publications">Pubblicazioni</a>
        <a href="/pages/photos.html" aria-current="page" data-i18n="nav.photos">Foto</a>
        <a href="/cv.html" data-i18n="nav.cv">CV</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn lang-btn" data-action="lang" data-i18n-label="lang" data-lang-label>EN</button>
        <button class="icon-btn" data-action="theme" data-i18n-label="theme">
          <i class="bi bi-moon-stars theme-icon-dark"></i><i class="bi bi-sun theme-icon-light"></i>
        </button>
        <button class="icon-btn menu-btn" data-action="menu" aria-expanded="false" aria-label="Menu">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="container page-intro">
      <h1 data-i18n="photos.title">Galleria fotografica</h1>
      <p data-i18n="photos.lead"></p>
    </section>

    <section class="container">
      <div class="gallery" id="photo-gallery"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>&copy; <span id="year"></span> Luca Garau</span>
    </div>
  </footer>

  <dialog class="lightbox" id="lightbox">
    <button class="lb-btn lb-close" data-i18n-label="close"><i class="bi bi-x-lg"></i></button>
    <button class="lb-btn lb-prev" data-i18n-label="photos.prev"><i class="bi bi-chevron-left"></i></button>
    <figure class="polaroid polaroid-large">
      <img id="lb-image" alt="">
      <figcaption>
        <span class="caption" id="lb-caption"></span>
        <span class="meta" id="lb-meta"></span>
      </figcaption>
    </figure>
    <button class="lb-btn lb-next" data-i18n-label="photos.next"><i class="bi bi-chevron-right"></i></button>
  </dialog>
</body>

</html>
