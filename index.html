<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca Garau — Researcher & Developer</title>
  <meta name="description" content="Luca Garau — ricercatore e sviluppatore in Computer Graphics, Geometry Processing e AI all'Università di Cagliari.">
  <meta property="og:title" content="Luca Garau — Researcher & Developer">
  <meta property="og:description" content="Computer Graphics, Geometry Processing e AI — Università di Cagliari.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lucagarau.github.io/">
  <meta property="og:image" content="https://lucagarau.github.io/assets/img/profile.png">
  <link rel="canonical" href="https://lucagarau.github.io/">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" defer></script>
  <script src="/assets/js/core.js" defer></script>
  <script src="/assets/js/home.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">Luca Garau</a>
      <nav class="nav" aria-label="Main">
        <a href="#experience" data-i18n="nav.experience">Esperienza</a>
        <a href="#education" data-i18n="nav.education">Formazione</a>
        <a href="#publications" data-i18n="nav.publications">Pubblicazioni</a>
        <a href="/pages/photos.html" data-i18n="nav.photos">Foto</a>
        <a href="/cv.html" data-i18n="nav.cv">CV</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn lang-btn" data-action="lang" data-i18n-label="lang" data-lang-label>EN</button>
        <button class="icon-btn" data-action="theme" data-i18n-label="theme">
          <i class="bi bi-moon-stars theme-icon-dark"></i><i class="bi bi-sun theme-icon-light"></i>
        </button>
        <button class="icon-btn menu-btn" data-action="menu" aria-expanded="false" aria-label="Menu">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero container" id="about">
      <div class="hero-text">
        <p class="eyebrow" id="hero-role"></p>
        <h1 id="hero-name">Luca Garau</h1>
        <p class="hero-bio" id="hero-bio"></p>
        <p class="hero-location"><i class="bi bi-geo-alt"></i> <span id="hero-location"></span></p>
        <div class="hero-actions">
          <a class="btn btn-primary" id="cv-download" href="/assets/cv/LucaGarau-CV.pdf" download>
            <i class="bi bi-download"></i> <span data-i18n="hero.cv">Scarica CV</span>
          </a>
          <a class="btn btn-ghost" href="/cv.html">
            <i class="bi bi-file-earmark-text"></i> <span data-i18n="hero.cvView">Versione web</span>
          </a>
        </div>
        <div class="socials" id="socials"></div>
      </div>
      <div class="hero-photo">
        <img id="hero-photo" src="/assets/img/profile.png" alt="Luca Garau" width="320" height="320">
      </div>
    </section>

    <section class="section container" id="experience">
      <h2 class="section-title" data-i18n="sec.experience">Esperienza</h2>
      <ol class="timeline" id="experience-list"></ol>
    </section>

    <section class="section container" id="education">
      <h2 class="section-title" data-i18n="sec.education">Formazione</h2>
      <ol class="timeline" id="education-list"></ol>
    </section>

    <section class="section container" id="publications">
      <h2 class="section-title" data-i18n="sec.publications">Pubblicazioni</h2>
      <div class="pub-list" id="publication-list"></div>
    </section>

    <div class="section container two-col">
      <section id="conferences">
        <h2 class="section-title" data-i18n="sec.conferences">Conferenze</h2>
        <ul class="conf-list" id="conference-list"></ul>
      </section>
      <section id="skills">
        <h2 class="section-title" data-i18n="sec.skills">Competenze</h2>
        <div id="skill-list"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>&copy; <span id="year"></span> Luca Garau</span>
      <span class="muted" id="footer-email"></span>
    </div>
  </footer>

  <dialog class="dialog" id="cite-dialog">
    <form method="dialog" class="dialog-inner">
      <div class="dialog-head">
        <h3 data-i18n="cite.title">Cita questo lavoro</h3>
        <button class="icon-btn" value="close" data-i18n-label="close"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="tabs" role="tablist" id="cite-tabs"></div>
      <pre class="cite-output" id="cite-output"></pre>
      <div class="dialog-foot">
        <button type="button" class="btn btn-primary" id="cite-copy">
          <i class="bi bi-clipboard"></i> <span data-i18n="copy">Copia</span>
        </button>
      </div>
    </form>
  </dialog>
</body>

</html>
